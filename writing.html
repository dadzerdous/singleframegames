<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SingleFrameGames — Writing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: system-ui, sans-serif;
    }

    .editor {
      max-width: 720px;
      margin: 3rem auto;
    }

    .editor input,
    .editor textarea {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.6rem;
      font-size: 1rem;
    }

    .editor textarea {
      min-height: 200px;
    }

    .editor button {
      padding: 0.6rem 1rem;
      cursor: pointer;
    }

    .post {
      max-width: 720px;
      margin: 3rem auto;
      border-top: 1px solid #ddd;
      padding-top: 1.5rem;
    }

    .post h2 {
      margin-bottom: 0.25rem;
    }

    .post time {
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .post p {
      line-height: 1.7;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <main class="editor">
    <h1>Writing</h1>

    <input id="title" placeholder="Post title" />
    <textarea id="content" placeholder="Write here…"></textarea>

    <button onclick="publishPost()">Post</button>
  </main>

  <section id="posts"></section>

<script>
  const postsEl = document.getElementById("posts");

  function loadPosts() {
    const posts = JSON.parse(localStorage.getItem("sfg_posts") || "[]");
    posts.forEach(renderPost);
  }

  function publishPost() {
    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!title || !content) return;

    const post = {
      title,
      content,
      date: new Date().toISOString()
    };

    const posts = JSON.parse(localStorage.getItem("sfg_posts") || "[]");
    posts.unshift(post);
    localStorage.setItem("sfg_posts", JSON.stringify(posts));

    renderPost(post);

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
  }

  function renderPost(post) {
    const article = document.createElement("article");
    article.className = "post";

    article.innerHTML = `
      <h2>${post.title}</h2>
      <time>${new Date(post.date).toLocaleDateString()}</time>
      <p>${post.content}</p>
    `;

    postsEl.prepend(article);
  }

  loadPosts();
</script>

</body>
</html>
